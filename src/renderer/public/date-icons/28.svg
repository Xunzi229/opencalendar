<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>OpenCalendar</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.3" y2="1">
      <stop stop-color="#ffffff"/><stop offset="0.7" stop-color="#fdfcfb"/><stop offset="1" stop-color="#eae9e7"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0.8" y2="1">
      <stop stop-color="#ff766b"/><stop offset="0.52" stop-color="#f45351"/><stop offset="1" stop-color="#e43c47"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.6" y2="1">
      <stop stop-color="#454753"/><stop offset="1" stop-color="#23242d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#1f2332" flood-opacity="0.16"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1f2332" flood-opacity="0.10"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="92" width="824" height="824" rx="184"/></clipPath>
