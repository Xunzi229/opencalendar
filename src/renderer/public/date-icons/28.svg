  <rect x="100" y="92" width="824" height="824" rx="184" fill="url(#paper)" filter="url(#shadow)"/>
  <g clip-path="url(#tile)">
    <path d="M100 92H924V344H100Z" fill="url(#red)"/>
    <path d="M100 344H924" stroke="#b9303a" stroke-opacity="0.20" stroke-width="3"/>
    <path d="M142 827H882" stroke="#d8d7d5" stroke-width="3"/>
    <path d="M156 847H868" stroke="#ffffff" stroke-width="3"/>
    <path d="M166 866H858" stroke="#d8d7d5" stroke-width="2"/>
  </g>
  <rect x="102" y="94" width="820" height="820" rx="182" fill="none" stroke="#ffffff" stroke-opacity="0.48" stroke-width="3"/>
  <g fill="#bc3540" opacity="0.34">
    <rect x="280" y="152" width="72" height="112" rx="36"/>
    <rect x="672" y="152" width="72" height="112" rx="36"/>
  </g>
