name: Windows standalone EXE

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Validate version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/check-release-version.mjs
      - name: Build standalone executable
        run: npx tauri build --target ${{ matrix.target }} --no-bundle -- --locked
      - name: Upload standalone executable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $asset = "Calendar_${version}_Windows_${env:BUILD_ARCH}.exe"
          Copy-Item "src-tauri/target/$env:BUILD_TARGET/release/opencalendar.exe" $asset
          gh release upload $env:RELEASE_TAG $asset --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  checksums:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Refresh checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir assets
          gh release download "$RELEASE_TAG" --dir assets --skip-existing
          cd assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
